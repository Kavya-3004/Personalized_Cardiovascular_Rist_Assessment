version: '3.8'

services:
  cardio-risk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardio_risk_assessment_app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    volumes:
      - ./outputs:/app/outputs
